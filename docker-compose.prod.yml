# Production overlay for hadalspace.com, on the wayve-mfa production host.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# TLS reuses wayve-mfa's Let's Encrypt certificate instead of issuing a new
# one: cert name "fluxze.com", whose names include hadalspace.com and
# www.hadalspace.com. It lives in wayve-mfa's Docker volumes, mounted here
# read-only:
#
#   rwayve_prod_letsencrypt_certs  /etc/letsencrypt   certificate + key
#   rwayve_prod_certbot_webroot    /var/www/certbot   ACME HTTP-01 challenges
#
# wayve-mfa's cron job (wayve-mfa/scripts/renew-certs.sh) renews it. Hadal
# never writes to these volumes. Our nginx serves the challenge directory on
# port 80, so renewals keep working while Hadal holds ports 80/443, and it
# reloads every 6 hours to pick up a renewed certificate.
#
# Only one nginx can bind ports 80/443 on the host: stop wayve-mfa's nginx
# (or have it proxy hadalspace.com here) before starting this one.
#
# Settings come from .env (see production.env.example). Production secrets
# belong in a secrets manager that writes .env or the environment (CASA 6.7.1).

services:
  db:
    # Not reachable from outside the compose network in production.
    ports: !reset []

  backend:
    environment:
      OAUTH_REDIRECT_URI: https://${DOMAIN:-hadalspace.com}/api/auth/callback

  nginx:
    ports: !override
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAME: ${DOMAIN:-hadalspace.com} www.${DOMAIN:-hadalspace.com}
      SSL_CERTIFICATE: /etc/letsencrypt/live/${CERT_NAME:-fluxze.com}/fullchain.pem
      SSL_CERTIFICATE_KEY: /etc/letsencrypt/live/${CERT_NAME:-fluxze.com}/privkey.pem
      HTTPS_REDIRECT_PORT_SUFFIX: ""
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-63072000}
      CERT_RELOAD_HOURS: "6"
    volumes: !override
      - wayve_letsencrypt:/etc/letsencrypt:ro
      - wayve_certbot_webroot:/var/www/certbot:ro

volumes:
  # Created and owned by wayve-mfa (compose project "rwayve_prod"). Compose
  # refuses to start if they don't exist, rather than creating empty ones.
  wayve_letsencrypt:
    external: true
    name: ${LETSENCRYPT_VOLUME:-rwayve_prod_letsencrypt_certs}
  wayve_certbot_webroot:
    external: true
    name: ${CERTBOT_WEBROOT_VOLUME:-rwayve_prod_certbot_webroot}
