name: CASA gate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: casa-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  CARGO_TERM_COLOR: always
  # Release tags must have every CASA requirement verified or n/a.
  CASA_STRICT: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}

jobs:
  gate:
    name: verify.sh full
    runs-on: ubuntu-latest
    # Throwaway database for the sign-in, session and IDOR tests.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hadal_test
          POSTGRES_DB: hadal_test
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hadal_test" --health-interval 2s
          --health-timeout 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://hadal_test:${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/hadal_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: frontend

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Install semgrep
        run: pipx install semgrep

      - name: CASA gate
        run: scripts/verify.sh full

  dast:
    name: OWASP ZAP baseline
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start stack
        run: |
          scripts/dev-certs.sh
          {
            printf 'POSTGRES_PASSWORD=%s\nHTTPS_PORT=8000\n' "$(openssl rand -hex 24)"
            # Placeholder OAuth client: lets the stack boot for the scan; no
            # real sign-in can complete with it.
            printf 'GOOGLE_CLIENT_ID=zap-scan.apps.googleusercontent.com\n'
            printf 'GOOGLE_CLIENT_SECRET=%s\n' "$(openssl rand -hex 24)"
            printf 'OAUTH_REDIRECT_URI=https://localhost:8000/api/auth/callback\n'
          } > .env
          docker compose up -d --build --wait
      # CASA 4.1.1 / 4.1.2: TLS versions and suites, HTTP->HTTPS, HSTS, and
      # TLS on every backend-to-Postgres connection.
      - name: TLS check
        run: scripts/check-tls.sh localhost 8000
      - name: ZAP baseline scan
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t https://localhost:8000 -I -r report.html -J report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap/
      - if: always()
        run: docker compose down -v
