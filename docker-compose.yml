services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hadal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hadal}
    # TLS required for every network connection (CASA 4.1.2). Certificates
    # come from scripts/dev-certs.sh.
    entrypoint: ["/usr/local/bin/tls-entrypoint.sh"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/tls-entrypoint.sh:/usr/local/bin/tls-entrypoint.sh:ro
      - ./certs/db/server.crt:/certs-src/server.crt:ro
      - ./certs/db/server.key:/certs-src/server.key:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Exposed on localhost only, for `cargo run` / psql during development.
    # TLS is required here too (psql and sqlx negotiate it by default).
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # verify-full: TLS, certificate signed by our DB CA, host name "db".
      DATABASE_URL: postgres://${POSTGRES_USER:-hadal}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hadal}?sslmode=verify-full&sslrootcert=/etc/hadal/db-ca.crt
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      RUST_LOG: ${RUST_LOG:-info}
      # Backend is only reachable via nginx (no published port), which sets
      # X-Real-IP, so the rate limiter may key on it. Never publish 8080
      # directly while this is true.
      TRUST_PROXY_HEADERS: "true"
      # Google OAuth client (Web application). The backend refuses to start
      # without them. Production: inject from a secrets manager (CASA 6.7.1).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in .env}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-https://localhost:${HTTPS_PORT:-8000}/api/auth/callback}
      SESSION_IDLE_SECS: ${SESSION_IDLE_SECS:-1800}
      SESSION_ABSOLUTE_SECS: ${SESSION_ABSOLUTE_SECS:-43200}
    volumes:
      - ./certs/db/ca.crt:/etc/hadal/db-ca.crt:ro
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    # The app is https://localhost:8000, the only published port. Plain HTTP
    # sent to it is redirected to HTTPS on the same port (nginx 497 handler).
    ports:
      - "${HTTPS_PORT:-8000}:443"
    environment:
      HTTPS_REDIRECT_PORT_SUFFIX: ":${HTTPS_PORT:-8000}"
      # Production keeps the image default (2 years). Locally it's 5 minutes,
      # because browsers apply HSTS to every port on localhost.
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-300}
    volumes:
      - ./certs/nginx:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
